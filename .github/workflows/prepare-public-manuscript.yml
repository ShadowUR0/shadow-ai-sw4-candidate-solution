name: Prepare public candidate manuscript

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-public-manuscript.yml
      - .github/scripts/prepare_public_manuscript.py
      - sw4_inverse_problem_paper.tex
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[prepared-manuscript]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare transparent manuscript metadata
        run: python .github/scripts/prepare_public_manuscript.py

      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: sw4_inverse_problem_paper.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit corrected source and PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw4_inverse_problem_paper.tex sw4_inverse_problem_paper.pdf
          if git diff --cached --quiet; then
            echo "No manuscript changes to commit."
          else
            git commit -m "Add corrected public manuscript and PDF [prepared-manuscript]"
            git push origin HEAD:main
          fi
